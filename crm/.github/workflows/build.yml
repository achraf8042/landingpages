        Compress-Archive -Path * -DestinationPath DigiSpherEMR-windows.zip
      shell: pwsh

  test-executable:
    name: Test Executable on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: DigiSpherEMR-${{ runner.os }}-py3.10

    - name: List downloaded files
      run: |
        ls -R
      shell: bash

    - name: Test executable exists (Windows)
      if: runner.os == 'Windows'
      run: |
        if (Test-Path "DigiSpherEMR.exe") {
          Write-Host "✅ Executable found"
          exit 0
        } else {
          Write-Host "❌ Executable not found"
          exit 1
        }
      shell: pwsh

    - name: Test executable exists (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        if [ -f "DigiSpherEMR" ] || [ -f "DigiSpherEMR.app/Contents/MacOS/DigiSpherEMR" ]; then
          echo "✅ Executable found"
          exit 0
        else
          echo "❌ Executable not found"
          ls -la
          exit 1
        fi
      shell: bash

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build, test-executable]
    if: always()

    steps:
    - name: Create Summary
      run: |
        echo "# 🏗️ DigiSpher EMR Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Build Status" >> $GITHUB_STEP_SUMMARY
        echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Windows | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Linux | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| macOS | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Status" >> $GITHUB_STEP_SUMMARY
        echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| All Platforms | ${{ needs.test-executable.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
